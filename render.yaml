services:
  # Django REST API (Backend)
  - type: web
    name: studio-django-api
    env: python
    plan: free
    rootDir: backend-django
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py create_admin && gunicorn studio_backend.wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: studio-postgres
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: "5"

  # Node.js real-time server (Socket.io + MongoDB)
  - type: web
    name: studio-realtime-node
    env: node
    plan: free
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: $PORT
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: studio-postgres
    plan: free
    databaseName: studio_db
    user: studio_user
