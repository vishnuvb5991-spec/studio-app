version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: studio_postgres
    environment:
      POSTGRES_DB: studio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - studio_network

  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    container_name: studio_redis
    ports:
      - "6379:6379"
    networks:
      - studio_network

  # Django Backend
  django:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: studio_django
    environment:
      - DEBUG=True
      - DB_HOST=postgres
      - DB_NAME=studio_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-change-this-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,django
    ports:
      - "8000:8000"
    volumes:
      - ./backend-django:/app
      - media_files:/app/media
    depends_on:
      - postgres
      - redis
    networks:
      - studio_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker
  celery:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: studio_celery
    environment:
      - DEBUG=True
      - DB_HOST=postgres
      - DB_NAME=studio_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-change-this-in-production
    volumes:
      - ./backend-django:/app
      - media_files:/app/media
    depends_on:
      - postgres
      - redis
    networks:
      - studio_network
    command: celery -A studio_backend worker -l info

  # MongoDB for Node.js
  mongodb:
    image: mongo:7
    container_name: studio_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: studio_app
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - studio_network

  # Node.js Socket.io Server
  node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: studio_node
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/studio_app?authSource=admin
      - JWT_SECRET=your-jwt-secret-key
    ports:
      - "5000:5000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - studio_network
    command: npm run dev

  # Web Admin Panel (React)
  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: studio_web
    environment:
      - REACT_APP_DJANGO_API=http://localhost:8000/api/v1
      - REACT_APP_NODE_API=http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./web-admin:/app
      - /app/node_modules
    depends_on:
      - django
      - node
    networks:
      - studio_network
    command: npm start

volumes:
  postgres_data:
  mongodb_data:
  media_files:

networks:
  studio_network:
    driver: bridge
